<!doctype html><html><head><meta charset="utf-8"><title>Dip Skid Simülatörü</title>
<style>*{box-sizing:border-box}body{margin:0;background:#12161c;color:#dde;font:13px system-ui}
.app{display:grid;grid-template-columns:300px 1fr 340px;height:100vh}.p{padding:10px;overflow:auto;background:#1a2028}
h3{margin:12px 0 6px;font-size:13px;color:#7fb6ff}input,select{background:#0e1218;color:#fff;border:1px solid #345;padding:3px;width:80px}
button{background:#27405f;color:#fff;border:0;padding:5px 8px;margin:2px;cursor:pointer;border-radius:3px}button:hover{background:#3a5f90}
.card{background:#0e1218;border:1px solid #345;padding:8px;margin:6px 0;border-radius:4px}.w{color:#ffb347}.g{color:#6f6}.r{color:#f66}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #234;padding:2px;text-align:right;font-size:11px}pre{font-size:10px;white-space:pre-wrap}</style></head>
<body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
